{% extends 'website/base.html' %}
{% block title %}Email Enviado{% endblock %}
{% block content %}
<div class="flex-grow flex items-center justify-center bg-bgSoft py-12 px-4 sm:px-6 lg:px-8 min-h-screen">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-3xl shadow-sm border border-gray-100 text-center">
        <div class="w-16 h-16 mx-auto bg-green-100 text-green-500 flex items-center justify-center rounded-full text-3xl mb-6">
            <i class="fa-regular fa-paper-plane"></i>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 font-heading">Verifique o seu Email</h2>
        <p class="mt-4 text-gray-600">
            Enviámos-lhe um email com instruções para definir a sua nova palavra-passe. Por favor, verifique a sua caixa de entrada (e a pasta de SPAM).
        </p>
        <div class="mt-8">
            <a href="{% url 'login' %}" class="text-sm font-medium text-primary hover:text-primaryHover transition">Voltar ao Login</a>
        </div>
    </div>
</div>
{% endblock %}
