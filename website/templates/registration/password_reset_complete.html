{% extends 'website/base.html' %}
{% block title %}Palavra-passe Alterada{% endblock %}
{% block content %}
<div class="flex-grow flex items-center justify-center bg-bgSoft py-12 px-4 sm:px-6 lg:px-8 min-h-screen">
    <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-3xl shadow-sm border border-gray-100 text-center">
        <div class="w-16 h-16 mx-auto bg-green-100 text-green-500 flex items-center justify-center rounded-full text-3xl mb-6">
            <i class="fa-solid fa-check"></i>
        </div>
        <h2 class="text-3xl font-bold text-gray-900 font-heading">Sucesso!</h2>
        <p class="mt-4 text-gray-600">
            A sua palavra-passe foi alterada com sucesso. Já pode iniciar sessão com a nova palavra-passe.
        </p>
        <div class="mt-8">
            <a href="{% url 'login' %}" class="inline-block bg-primary text-white font-bold py-3 px-8 rounded-full hover:bg-primaryHover transition shadow-md">Iniciar Sessão</a>
        </div>
    </div>
</div>
{% endblock %}
