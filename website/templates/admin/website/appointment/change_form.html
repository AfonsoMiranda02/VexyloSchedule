{% extends "admin/change_form.html" %}

{% block content %}
{{ block.super }}
<script>
document.addEventListener("DOMContentLoaded", function() {
    // Procurar um dos botões do painel direito (ex: História ou Gravar)
    var historyBtn = document.querySelector('a[href*="history"]');
    var container = null;
    
    if (historyBtn) {
        container = historyBtn.parentElement;
    } else {
        var saveBtn = document.querySelector('input[name="_save"]');
        if (saveBtn) container = saveBtn.parentElement;
    }
    
    if (container) {
        var backBtn = document.createElement('a');
        backBtn.href = "{% url 'admin:website_appointment_changelist' %}";
        // Usar as classes do Jazzmin/Bootstrap para botões de bloco
        backBtn.className = "btn btn-block"; 
        backBtn.innerHTML = '<i class="fas fa-arrow-left"></i> Voltar ao Calendário';
        backBtn.style.backgroundColor = '#4b5563';
        backBtn.style.borderColor = '#374151';
        backBtn.style.color = 'white';
        backBtn.style.marginTop = '10px';
        backBtn.style.display = 'block';
        
        // Adicionar efeito hover simples
        backBtn.onmouseover = function() { this.style.backgroundColor = '#374151'; };
        backBtn.onmouseout = function() { this.style.backgroundColor = '#4b5563'; };
        
        container.appendChild(backBtn);
    }
});
</script>
{% endblock %}
