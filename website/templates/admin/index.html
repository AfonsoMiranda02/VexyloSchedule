{% extends "admin/index.html" %}
{% load static %}

{% block content %}
<div class="container-fluid mb-4">
    <div class="row">
        <!-- KPI 1 -->
        <div class="col-lg-3 col-6">
            <div class="small-box bg-info">
                <div class="inner">
                    <h3 id="kpi-clients"><i class="fas fa-spinner fa-spin"></i></h3>
                    <p>Total de Clientes</p>
                </div>
                <div class="icon">
                    <i class="fas fa-users"></i>
                </div>
            </div>
        </div>
        <!-- KPI 2 -->
        <div class="col-lg-3 col-6">
            <div class="small-box" style="background-color: #722F37; color: white;">
                <div class="inner">
                    <h3 id="kpi-appointments"><i class="fas fa-spinner fa-spin"></i></h3>
                    <p>Marcações Hoje</p>
                </div>
                <div class="icon">
                    <i class="fas fa-calendar-check"></i>
                </div>
            </div>
        </div>
        <!-- KPI 3 -->
        <div class="col-lg-3 col-6">
            <div class="small-box bg-warning">
                <div class="inner">
                    <h3 id="kpi-upcoming"><i class="fas fa-spinner fa-spin"></i></h3>
                    <p>Marcações Futuras</p>
                </div>
                <div class="icon">
                    <i class="fas fa-clock"></i>
                </div>
            </div>
        </div>
        <!-- KPI 4 -->
        <div class="col-lg-3 col-6">
            <div class="small-box bg-success">
                <div class="inner">
                    <h3 id="kpi-services"><i class="fas fa-spinner fa-spin"></i></h3>
                    <p>Serviços Ativos</p>
                </div>
                <div class="icon">
                    <i class="fas fa-cut"></i>
                </div>
            </div>
        </div>
    </div>
    <div class="row mt-2" id="next-appt-container" style="display: none;">
        <div class="col-12">
            <div class="alert shadow-sm d-flex justify-content-between align-items-center" style="border-radius: 12px; background: linear-gradient(45deg, #10b981, #3b82f6); color: white !important; border: none;">
                <div>
                    <h5 class="m-0"><i class="fas fa-bell mr-2"></i> Próxima Marcação: <strong id="next-appt-service"></strong></h5>
                    <span class="d-block mt-1" style="font-size: 0.95rem;">
                        <i class="fas fa-user mr-1"></i> <span id="next-appt-client"></span> &nbsp;&nbsp;|&nbsp;&nbsp; 
                        <i class="fas fa-user-tie mr-1"></i> <span id="next-appt-staff"></span> &nbsp;&nbsp;|&nbsp;&nbsp; 
                        <i class="far fa-clock mr-1"></i> <span id="next-appt-time"></span>
                    </span>
                </div>
                <div>
                    <a href="/vexylo-admin/website/appointment/" class="btn btn-sm btn-light" style="border-radius: 20px; font-weight: bold; color: #3b82f6;">Ver Todas</a>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row mt-2">
        <div class="col-lg-6 col-12">
            <div class="card">
                <div class="card-header border-0">
                    <h3 class="card-title">
                        <i class="fas fa-chart-bar mr-1"></i>
                        Evolução (Últimos 7 Dias)
                    </h3>
                </div>
                <div class="card-body">
                    <canvas id="appointmentsChart" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
                </div>
            </div>
        </div>
        <div class="col-lg-3 col-6">
            <div class="card">
                <div class="card-header border-0">
                    <h3 class="card-title">
                        <i class="fas fa-fire mr-1"></i>
                        Top Serviços
                    </h3>
                </div>
                <div class="card-body">
                    <canvas id="topServicesChart" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
                </div>
            </div>
        </div>
        <div class="col-lg-3 col-6">
            <div class="card">
                <div class="card-header border-0">
                    <h3 class="card-title">
                        <i class="fas fa-chart-pie mr-1"></i>
                        Status (Geral)
                    </h3>
                </div>
                <div class="card-body">
                    <canvas id="statusChart" style="min-height: 250px; height: 250px; max-height: 250px; max-width: 100%;"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        fetch('/api/admin-dashboard-stats/')
            .then(response => response.json())
            .then(data => {
                // Update KPIs
                document.getElementById('kpi-clients').innerText = data.total_clients;
                document.getElementById('kpi-appointments').innerText = data.appointments_today;
                document.getElementById('kpi-upcoming').innerText = data.upcoming_appointments;
                document.getElementById('kpi-services').innerText = data.total_services;
                
                // Next Appointment
                if (data.next_appointment) {
                    document.getElementById('next-appt-container').style.display = 'flex';
                    document.getElementById('next-appt-service').innerText = data.next_appointment.service_name;
                    document.getElementById('next-appt-client').innerText = data.next_appointment.client_name;
                    document.getElementById('next-appt-staff').innerText = data.next_appointment.staff_name;
                    document.getElementById('next-appt-time').innerText = data.next_appointment.date + " às " + data.next_appointment.time;
                } else {
                    document.getElementById('next-appt-container').style.display = 'none';
                }
                
                // Render Chart: Evolução
                var ctx = document.getElementById('appointmentsChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.chart_labels,
                        datasets: [{
                            label: 'Marcações',
                            data: data.chart_data,
                            backgroundColor: '#722F37',
                            borderRadius: 4,
                            barThickness: 20
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: {
                                grid: { color: 'rgba(128, 128, 128, 0.2)' },
                                ticks: { color: 'rgba(128, 128, 128, 0.8)' }
                            },
                            y: {
                                beginAtZero: true,
                                grid: { color: 'rgba(128, 128, 128, 0.2)' },
                                ticks: {
                                    stepSize: 1,
                                    color: 'rgba(128, 128, 128, 0.8)'
                                }
                            }
                        },
                        plugins: {
                            legend: {
                                display: false
                            }
                        }
                    }
                });

                // Render Chart: Top Services
                var ctxTop = document.getElementById('topServicesChart').getContext('2d');
                new Chart(ctxTop, {
                    type: 'doughnut',
                    data: {
                        labels: data.top_services_labels,
                        datasets: [{
                            data: data.top_services_data,
                            backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: 'rgba(128, 128, 128, 0.9)' }
                            }
                        },
                        cutout: '70%'
                    }
                });

                // Render Chart: Status
                var ctxStatus = document.getElementById('statusChart').getContext('2d');
                
                // Mapear cores para os status
                var statusColors = data.status_labels.map(status => {
                    if (status === 'Confirmada') return '#10b981';
                    if (status === 'Pendente') return '#f59e0b';
                    if (status === 'Aguardando Fecho') return '#8b5cf6';
                    if (status === 'Concluída') return '#3b82f6';
                    if (status === 'Cancelada') return '#ef4444';
                    if (status === 'Faltou') return '#6b7280';
                    return '#9ca3af';
                });

                new Chart(ctxStatus, {
                    type: 'pie',
                    data: {
                        labels: data.status_labels,
                        datasets: [{
                            data: data.status_data,
                            backgroundColor: statusColors,
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { color: 'rgba(128, 128, 128, 0.9)' }
                            }
                        }
                    }
                });

            })
            .catch(error => {
                console.error("Erro ao carregar dados do dashboard:", error);
                document.getElementById('kpi-clients').innerText = "Erro";
                document.getElementById('kpi-appointments').innerText = "Erro";
            });

    });
</script>

<!-- Render the original Jazzmin apps below -->
{{ block.super }}
{% endblock %}
