name: VexyloSchedule CI / CD Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_vexylo
          POSTGRES_USER: vexylo_user
          POSTGRES_PASSWORD: vexylo_secure_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vexylo_user -d test_vexylo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Código Fonte
      uses: actions/checkout@v4

    - name: Configurar Node.js (Compilação Assets)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Compilar Tailwind CSS de Produção (npm ci determinístico)
      run: |
        npm ci
        npm run build:css

    - name: Configurar Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar e Validar Dependências Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip check

    - name: Executar Migrações de Base de Dados e Provisionamento de Cache
      env:
        DEBUG: "False"
        SECRET_KEY: "ci-secret-key-for-testing-purposes-at-least-50-characters-long-123456"
        DATABASE_URL: "postgresql://vexylo_user:vexylo_secure_password_123@localhost:5432/test_vexylo"
        ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        APP_BASE_URL: "http://localhost:8000"
        EMAIL_HOST_USER: "ci-user@example.com"
        EMAIL_HOST_PASSWORD: "ci-password"
      run: |
        python manage.py migrate --noinput
        python manage.py createcachetable

    - name: Verificação de Prontidão de Produção (DatabaseCache, DB, Configurações)
      env:
        DEBUG: "False"
        SECRET_KEY: "ci-secret-key-for-testing-purposes-at-least-50-characters-long-123456"
        DATABASE_URL: "postgresql://vexylo_user:vexylo_secure_password_123@localhost:5432/test_vexylo"
        ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        APP_BASE_URL: "http://localhost:8000"
        EMAIL_HOST_USER: "ci-user@example.com"
        EMAIL_HOST_PASSWORD: "ci-password"
      run: |
        python manage.py verify_production_ready

    - name: Verificação de Integridade de Ficheiros Estáticos (WhiteNoise Manifest)
      env:
        DEBUG: "False"
        SECRET_KEY: "ci-secret-key-for-testing-purposes-at-least-50-characters-long-123456"
        DATABASE_URL: "postgresql://vexylo_user:vexylo_secure_password_123@localhost:5432/test_vexylo"
        ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        APP_BASE_URL: "http://localhost:8000"
        EMAIL_HOST_USER: "ci-user@example.com"
        EMAIL_HOST_PASSWORD: "ci-password"
      run: |
        python manage.py collectstatic --noinput

    - name: Verificação do Sistema Django (System Check)
      env:
        DEBUG: "False"
        SECRET_KEY: "ci-secret-key-for-testing-purposes-at-least-50-characters-long-123456"
        DATABASE_URL: "postgresql://vexylo_user:vexylo_secure_password_123@localhost:5432/test_vexylo"
        ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        APP_BASE_URL: "http://localhost:8000"
        EMAIL_HOST_USER: "ci-user@example.com"
        EMAIL_HOST_PASSWORD: "ci-password"
      run: |
        python manage.py check

    - name: Verificação de Segurança para Deploy (--deploy)
      env:
        DEBUG: "False"
        SECRET_KEY: "ci-secret-key-for-testing-purposes-at-least-50-characters-long-123456"
        DATABASE_URL: "postgresql://vexylo_user:vexylo_secure_password_123@localhost:5432/test_vexylo"
        ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        APP_BASE_URL: "http://localhost:8000"
        SECURE_SSL_REDIRECT: "True"
        EMAIL_HOST_USER: "ci-user@example.com"
        EMAIL_HOST_PASSWORD: "ci-password"
      run: |
        python manage.py check --deploy --fail-level WARNING

    - name: Validar se todas as migrações foram geradas
      env:
        DEBUG: "True"
        SECRET_KEY: "ci-secret-key-for-testing-purposes-at-least-50-characters-long-123456"
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Executar Testes Automatizados em PostgreSQL Real
      env:
        DEBUG: "False"
        SECRET_KEY: "ci-secret-key-for-testing-purposes-at-least-50-characters-long-123456"
        DATABASE_URL: "postgresql://vexylo_user:vexylo_secure_password_123@localhost:5432/test_vexylo"
        ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
        APP_BASE_URL: "http://localhost:8000"
        USE_REAL_POSTGRES_TESTS: "true"
        CI_POSTGRES_REQUIRED: "true"
        EMAIL_HOST_USER: "ci-user@example.com"
        EMAIL_HOST_PASSWORD: "ci-password"
      run: |
        python manage.py test

    - name: Build da Imagem Docker Multi-Stage
      run: |
        docker build -t vexylo-schedule:ci .
